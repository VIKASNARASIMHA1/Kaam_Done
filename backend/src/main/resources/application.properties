spring.application.name=taskflow-backend

# H2 file-based database - no external DB install needed
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/taskflow;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console for inspecting data during dev: http://localhost:8080/h2-console
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

# JWT
app.jwt.secret=${JWT_SECRET:TaskFlowSuperSecretKeyForJWTSigning_ChangeInProduction_1234567890}
app.jwt.expiration-ms=86400000

# File attachments
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.springframework.security=INFO
